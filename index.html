<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#f7eef4">
<meta name="description" content="Turn your Steam library into a cozy shelf, a shareable top nine, and playful friend comparisons.">
<title>shelfwear - your cozy Steam library shelf</title>
<script>
  /* Before first paint, so the page never shows one palette and swaps to another.
     Every palette block in palettes.css declares its own color-scheme, so setting the attribute
     is enough; the module later sets it again through the store, which is a no-op when they
     agree. Wrapped because localStorage throws outright in a private window. */
  (function () {
    var t;
    try { t = localStorage.getItem("shelfwear:theme:cozy-v2"); } catch (e) {}
    document.documentElement.setAttribute("data-theme", t || "cherry-blossom-dusk");
  })();
</script>
</head>
<body class="grain"><div id="root"></div><script type="module" src="/src/main.tsx"></script></body>
</html>
