name: Cloudflare deploy

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: shelfwear-cloudflare-production
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy Worker
    runs-on: ubuntu-latest
    steps:
      - name: Check required secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          STEAM_WEB_API_KEY: ${{ secrets.STEAM_WEB_API_KEY }}
        run: |
          missing=""
          [ -z "$CLOUDFLARE_API_TOKEN" ] && missing="$missing CLOUDFLARE_API_TOKEN"
          [ -z "$CLOUDFLARE_ACCOUNT_ID" ] && missing="$missing CLOUDFLARE_ACCOUNT_ID"
          [ -z "$STEAM_WEB_API_KEY" ] && missing="$missing STEAM_WEB_API_KEY"
          if [ -n "$missing" ]; then
            echo "::error::Missing required GitHub Actions secrets:$missing"
            exit 1
          fi

      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build static assets
        run: npm run build

      - name: Deploy Shelfwear
        id: deploy
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4"
          command: deploy
          secrets: |
            STEAM_WEB_API_KEY
        env:
          STEAM_WEB_API_KEY: ${{ secrets.STEAM_WEB_API_KEY }}

      - name: Verify deployed site and Pages API bridge
        env:
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.deployment-url }}
        run: |
          set -euo pipefail
          if [ -z "$DEPLOYMENT_URL" ]; then
            echo "::error::Wrangler did not return a deployment URL."
            exit 1
          fi

          curl --fail --silent --show-error --retry 4 --retry-delay 2 "$DEPLOYMENT_URL/" > /tmp/shelfwear-index.html
          grep -qi 'shelfwear' /tmp/shelfwear-index.html

          status="$(
            curl --silent --show-error --retry 4 --retry-delay 2               --header 'Origin: https://rlawoals0529.github.io'               --dump-header /tmp/shelfwear-api-headers.txt               --output /tmp/shelfwear-api-body.json               --write-out '%{http_code}'               "$DEPLOYMENT_URL/api/steam/library?profile=not-valid"
          )"

          if [ "$status" != "400" ]; then
            echo "::error::Expected the invalid-profile smoke check to return 400; got $status."
            cat /tmp/shelfwear-api-body.json
            exit 1
          fi
          grep -qi '^content-type: application/json' /tmp/shelfwear-api-headers.txt
          grep -qi '^access-control-allow-origin: https://rlawoals0529.github.io' /tmp/shelfwear-api-headers.txt
          grep -q '"error"' /tmp/shelfwear-api-body.json

          # Blue Protocol: Star Resonance uses Steam's newer hashed artwork layout. Its public
          # GetOwnedGames icon hash gives us a reliable official-Steam fallback when a
          # portrait cannot be discovered, so keep that path in the live smoke test.
          curl --fail --silent --show-error --retry 4 --retry-delay 2             --header 'Origin: https://rlawoals0529.github.io'             --dump-header /tmp/shelfwear-cover-headers.txt             --output /tmp/shelfwear-cover.bin             "$DEPLOYMENT_URL/api/steam/cover/3681810?icon=8c7fc95092f64b0a99c4e02263caf254da89b7bb"
          grep -qi '^content-type: image/' /tmp/shelfwear-cover-headers.txt
          grep -qi '^access-control-allow-origin: https://rlawoals0529.github.io' /tmp/shelfwear-cover-headers.txt
          test -s /tmp/shelfwear-cover.bin

      - name: Record deployment URL
        env:
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.deployment-url }}
        run: |
          echo "### Shelfwear Cloudflare deployment" >> "$GITHUB_STEP_SUMMARY"
          if [ -n "$DEPLOYMENT_URL" ]; then
            echo "$DEPLOYMENT_URL" >> "$GITHUB_STEP_SUMMARY"
            echo "Live smoke check: PASS" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Wrangler completed without returning a deployment URL in the action output." >> "$GITHUB_STEP_SUMMARY"
          fi
